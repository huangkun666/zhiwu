name: Build Zhiwu Android APK & OTA Update

on:
  push:
    branches-ignore:
      - ota-index
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zhiwu-ota-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute build metadata
        id: ver
        run: |
          VERSION="1.0.${{ github.run_number }}"
          FULL_SHA="${GITHUB_SHA}"
          SHORT_SHA="${GITHUB_SHA::7}"
          BRANCH="${GITHUB_REF_NAME}"
          MSG=$(git log -1 --pretty=%s)
          IS_MAIN="false"
          if [ "$BRANCH" = "main" ] || [ "$BRANCH" = "master" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            IS_MAIN="true"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "full_sha=${FULL_SHA}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
          echo "msg=${MSG}" >> "$GITHUB_OUTPUT"
          echo "is_main=${IS_MAIN}" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Build standalone mobile web bundle
        working-directory: client
        env:
          VITE_STANDALONE: 'true'
          VITE_APP_VERSION: ${{ steps.ver.outputs.version }}
          VITE_APP_BRANCH: ${{ steps.ver.outputs.branch }}
          VITE_APP_COMMIT: ${{ steps.ver.outputs.full_sha }}
        run: |
          npm ci || npm install
          npm run build

      - name: Package per-commit OTA bundle
        working-directory: client/dist
        env:
          SHORT_SHA: ${{ steps.ver.outputs.sha }}
        run: |
          zip -rq "../../web-bundle-${SHORT_SHA}.zip" .
          cp "../../web-bundle-${SHORT_SHA}.zip" ../../web-bundle.zip

      - name: Setup Java 21
        if: steps.ver.outputs.is_main == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK (API 36)
        if: steps.ver.outputs.is_main == 'true'
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'

      - name: Cache Gradle dependencies
        if: steps.ver.outputs.is_main == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('client/android/**/*.gradle*', 'client/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Sync Capacitor & build Android APK
        if: steps.ver.outputs.is_main == 'true'
        run: |
          cd client
          npx cap sync android
          cd android
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../../zhiwu-android.apk

      - name: Upload Zhiwu APK Artifact
        if: steps.ver.outputs.is_main == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: zhiwu-android-apk
          path: zhiwu-android.apk
          retention-days: 30

      - name: Publish OTA bundle & refresh rate-limit-free index (ota-index)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          APP_VER: ${{ steps.ver.outputs.version }}
          APP_BRANCH: ${{ steps.ver.outputs.branch }}
          APP_SHA: ${{ steps.ver.outputs.full_sha }}
          APP_SHORT_SHA: ${{ steps.ver.outputs.sha }}
          APP_MSG: ${{ steps.ver.outputs.msg }}
          IS_MAIN: ${{ steps.ver.outputs.is_main }}
        run: |
          if ! gh release view latest-ota >/dev/null 2>&1; then
            gh release create latest-ota --title "OTA Builds" --notes "Zhiwu OTA Releases"
          fi

          gh release upload latest-ota "web-bundle-${APP_SHORT_SHA}.zip" --clobber
          if [ "$IS_MAIN" = "true" ]; then
            gh release upload latest-ota web-bundle.zip zhiwu-android.apk --clobber
          fi

          node <<'EOF'
          const { execFileSync } = require('child_process');
          const fs = require('fs');

          const repo = process.env.REPO;
          const rel = JSON.parse(
            execFileSync('gh', ['release', 'view', 'latest-ota', '--json', 'body,assets'], { encoding: 'utf8' })
          );
          const body = rel.body || '';

          let previousIndex = {};
          try {
            previousIndex = JSON.parse(execFileSync('git', ['show', 'refs/remotes/origin/ota-index:index.json'], {
              encoding: 'utf8', stdio: ['ignore', 'pipe', 'ignore'],
            }));
          } catch {}
          const builds = { ...previousIndex.bundlesBySha };
          const bm = body.match(/<!--ZHIWU_BUILDS:(.*?)-->/);
          if (bm && bm[1]) {
            try { Object.assign(builds, JSON.parse(bm[1])); } catch {}
          }

          let mainMeta = null;
          const mm = body.match(/<!--ZHIWU_META:(.*?)-->/);
          if (mm && mm[1]) {
            try { mainMeta = JSON.parse(mm[1]); } catch {}
          }

          const shortSha = process.env.APP_SHORT_SHA.toLowerCase();
          builds[shortSha] = {
            sha: process.env.APP_SHA,
            shortSha,
            branch: process.env.APP_BRANCH,
            version: process.env.APP_VER,
            // Older OTA-capable apps can use the web UI. The phone MCP service is detected at runtime.
            nativeVersion: 2,
            message: process.env.APP_MSG,
            builtAt: new Date().toISOString(),
            downloadUrl: `https://github.com/${repo}/releases/download/latest-ota/web-bundle-${shortSha}.zip`,
          };

          if (process.env.IS_MAIN === 'true' || !mainMeta) {
            mainMeta = {
              version: process.env.APP_VER,
              nativeVersion: 4,
              branch: process.env.APP_BRANCH,
              commit: shortSha,
              changelog: process.env.APP_MSG,
            };
          }

          // Prune commit bundles beyond the 25 most recent to keep storage clean
          const commitAssets = (rel.assets || [])
            .filter((a) => /^web-bundle-[0-9a-f]{7,}\.zip$/i.test(a.name))
            .sort((a, b) => new Date(b.updatedAt || 0).getTime() - new Date(a.updatedAt || 0).getTime());

          const keepSet = new Set();
          commitAssets.forEach((asset, idx) => {
            const m = asset.name.match(/^web-bundle-([0-9a-f]{7,})\.zip$/i);
            const shaKey = m ? m[1].toLowerCase().slice(0, 7) : '';
            if (idx < 25) {
              // A ZIP alone cannot establish which native capabilities the bundle needs.
              if (Number.isInteger(builds[shaKey]?.nativeVersion) && builds[shaKey].nativeVersion > 0) {
                keepSet.add(shaKey);
                builds[shaKey].downloadUrl = `https://github.com/${repo}/releases/download/latest-ota/${asset.name}`;
              }
            } else {
              try {
                execFileSync('gh', ['release', 'delete-asset', 'latest-ota', asset.name, '--yes'], { stdio: 'inherit' });
              } catch {}
            }
          });
          keepSet.add(shortSha);

          for (const key of Object.keys(builds)) {
            if (!keepSet.has(key)) delete builds[key];
          }

          const notes = [
            `<!--ZHIWU_META:${JSON.stringify(mainMeta)}-->`,
            `<!--ZHIWU_BUILDS:${JSON.stringify(builds)}-->`,
            `### 知悟 OTA 更新索引`,
            `最近构建：\`${process.env.APP_BRANCH}\` @ \`${shortSha}\` — ${process.env.APP_MSG}`,
          ].join('\n');

          fs.writeFileSync('/tmp/ota_notes.md', notes, 'utf8');
          execFileSync('gh', ['release', 'edit', 'latest-ota', '--title', `v${mainMeta.version}`, '--notes-file', '/tmp/ota_notes.md'], {
            stdio: 'inherit',
          });

          // Build complete branch + commit index using local git refs (zero API calls)
          const rawRefs = execFileSync(
            'git',
            ['for-each-ref', '--sort=-committerdate', '--format=%(refname:short)', 'refs/remotes/origin'],
            { encoding: 'utf8' }
          )
            .split('\n')
            .map((s) => s.trim())
            .filter((s) => s && s !== 'origin/HEAD' && s !== 'origin/ota-index');

          const branches = [];
          for (const ref of rawRefs.slice(0, 20)) {
            const name = ref.replace(/^origin\//, '');
            const logOut = execFileSync(
              'git',
              ['log', '-n', '25', '--format=%H%x1f%h%x1f%s%x1f%cI%x1f%an', ref],
              { encoding: 'utf8' }
            );
            const commits = logOut
              .split('\n')
              .map((line) => line.trim())
              .filter(Boolean)
              .map((line) => {
                const [sha, sSha, message, date, author] = line.split('\x1f');
                return { sha, shortSha: (sSha || sha.slice(0, 7)).slice(0, 7), message, date, author };
              });
            if (commits.length === 0) continue;
            branches.push({
              name,
              headSha: commits[0].sha,
              headShortSha: commits[0].shortSha,
              headMessage: commits[0].message,
              headDate: commits[0].date,
              commits,
            });
          }

          const indexPayload = {
            updatedAt: new Date().toISOString(),
            latestNativeVersion: mainMeta.nativeVersion || previousIndex.latestNativeVersion || 2,
            apkDownloadUrl: `https://github.com/${repo}/releases/download/latest-ota/zhiwu-android.apk`,
            bundlesBySha: builds,
            branches,
          };

          fs.writeFileSync('/tmp/ota_index.json', JSON.stringify(indexPayload, null, 2), 'utf8');
          EOF

          # Push standalone single-commit orphan branch `ota-index` for zero-rate-limit raw.githubusercontent.com reads
          rm -rf /tmp/ota-index-repo
          mkdir -p /tmp/ota-index-repo
          cp /tmp/ota_index.json /tmp/ota-index-repo/index.json
          cd /tmp/ota-index-repo
          git init -b ota-index
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json
          git commit -m "ota-index: ${APP_BRANCH}@${APP_SHORT_SHA}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          git push --force origin ota-index
